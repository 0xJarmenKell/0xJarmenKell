<text x="48" y="188" class="sans" font-size="16.5" font-weight="700" fill="#EEEEF8">Engineering Leadership</text>
<text x="48" y="213" class="sans" font-size="13" fill="#A6A6C0">Founder &amp; CTO at Techverse.</text>
<text x="48" y="233" class="sans" font-size="13" fill="#A6A6C0">Turning product vision into</text>
<text x="48" y="253" class="sans" font-size="13" fill="#A6A6C0">scalable architecture — and</text>
<text x="48" y="273" class="sans" font-size="13" fill="#A6A6C0">leading the teams that ship it.</text>
<text x="48" y="290" class="mono" font-size="9.5" letter-spacing="1.2" fill="#8B5CF6">STRATEGY · ARCHITECTURE · TEAMS</text></g>
