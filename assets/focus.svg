<rect x="336" y="116" width="40" height="40" rx="10" fill="url(#g-cyan)"/>
<g transform="translate(336 116)" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14 9 20.5 15 27"/><path d="M25 14 31 20.5 25 27"/><path d="M22.5 11.5 17.5 29.5"/></g>
<text x="336" y="188" class="sans" font-size="16.5" font-weight="700" fill="#EEEEF8">Full-Stack Engineering</text>
<text x="336" y="213" class="sans" font-size="13" fill="#A6A6C0">Angular, React &amp; Next.js on</text>
<text x="336" y="233" class="sans" font-size="13" fill="#A6A6C0">Node.js, Express, Rails and</text>
<text x="336" y="253" class="sans" font-size="13" fill="#A6A6C0">Supabase back-ends: platforms,</text>
<text x="336" y="273" class="sans" font-size="13" fill="#A6A6C0">dashboards and marketplaces.</text>
<text x="336" y="290" class="mono" font-size="9.5" letter-spacing="1.2" fill="#22D3EE">TYPESCRIPT · APIS · PRODUCT UX</text></g>
<g class="in" style="animation-delay:0.45s">
<rect x="604" y="96" width="272" height="214" rx="14" fill="#11111E" stroke="#1F1F35"/>
<path d="M618 96.5H724" stroke="#F472B6" stroke-width="1.5" opacity=".9"/>
