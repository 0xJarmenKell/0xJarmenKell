<svg xmlns="http://www.w3.org/2000/svg" width="900" height="336" viewBox="0 0 900 336" fill="none" role="img" aria-label="What I do: engineering leadership, full-stack engineering, security &amp; DevSecOps">
<title>What I do: engineering leadership, full-stack engineering, security &amp; DevSecOps</title>
<style>
