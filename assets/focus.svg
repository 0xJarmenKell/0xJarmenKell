<text x="28" y="40" class="mono" font-size="11" letter-spacing="2.2" fill="#8B5CF6">02<tspan fill="#6C6C88"> / </tspan>WHAT I DO</text>
<text x="28" y="72" class="sans" font-size="21" font-weight="700" fill="#EEEEF8">From architecture to production — end to end.</text>
