<g transform="translate(624 116)" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 8.5 30 12.5V20c0 6-4.5 10-10 12-5.5-2-10-6-10-12v-7.5Z"/><path d="M15.5 20.5 19 24l6-7"/></g>
<text x="624" y="188" class="sans" font-size="16.5" font-weight="700" fill="#EEEEF8">Security &amp; DevSecOps</text>
<text x="624" y="213" class="sans" font-size="13" fill="#A6A6C0">Roots in networks &amp; sys-admin.</text>
<text x="624" y="233" class="sans" font-size="13" fill="#A6A6C0">CI/CD with Docker &amp; Jenkins,</text>
