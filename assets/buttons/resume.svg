<svg xmlns="http://www.w3.org/2000/svg" width="111" height="44" viewBox="0 0 111 44" fill="none" role="img" aria-label="Résumé">
<title>Résumé</title>
<style>
.sans{font-family:'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,Inter,'Helvetica Neue',Ubuntu,Arial,sans-serif}
.mono{font-family:'JetBrains Mono','Cascadia Code','SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.in{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
.blink{animation:blink 1.05s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<clipPath id="b-clip"><rect width="111" height="44" rx="12"/></clipPath>
<linearGradient id="b-edge" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#8B5CF6" stop-opacity=".75"/>
  <stop offset=".45" stop-color="#1F1F35" stop-opacity=".9"/>
  <stop offset="1" stop-color="#22D3EE" stop-opacity=".55"/>
</linearGradient>
<radialGradient id="b-spot" cx="0" cy="0" r="1">
  <stop offset="0" stop-color="#fff" stop-opacity=".06"/>
  <stop offset="1" stop-color="#fff" stop-opacity="0"/>
</radialGradient></defs>
<g clip-path="url(#b-clip)"><rect width="111" height="44" fill="#0C0C16"/><ellipse cx="0" cy="0" rx="67" ry="40" fill="url(#b-spot)"/>
<g transform="translate(16 13)" stroke="#22D3EE" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 1.5h6.5L14.5 5.5v10a1 1 0 0 1-1 1h-9.5a1 1 0 0 1-1-1v-13a1 1 0 0 1 1-1Z"/><path d="M10.5 1.5v4h4"/><path d="M6 10h6.5M6 13h4.5"/></g>
<text x="44" y="27" class="sans" font-size="14" font-weight="600" fill="#EEEEF8">Résumé</text>
</g><rect x=".5" y=".5" width="110" height="43" rx="11.5" fill="none" stroke="url(#b-edge)"/>
</svg>
