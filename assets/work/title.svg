<svg xmlns="http://www.w3.org/2000/svg" width="900" height="76" viewBox="0 0 900 76" fill="none" role="img" aria-label="Selected work — browse all repositories">
<title>Selected work — browse all repositories</title>
<style>
.sans{font-family:'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,Inter,'Helvetica Neue',Ubuntu,Arial,sans-serif}
.mono{font-family:'JetBrains Mono','Cascadia Code','SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.in{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
.blink{animation:blink 1.05s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<clipPath id="wt-clip"><rect width="900" height="76" rx="18"/></clipPath>
<linearGradient id="wt-edge" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#8B5CF6" stop-opacity=".75"/>
  <stop offset=".45" stop-color="#1F1F35" stop-opacity=".9"/>
  <stop offset="1" stop-color="#22D3EE" stop-opacity=".55"/>
</linearGradient>
<radialGradient id="wt-spot" cx="0" cy="0" r="1">
  <stop offset="0" stop-color="#fff" stop-opacity=".06"/>
  <stop offset="1" stop-color="#fff" stop-opacity="0"/>
</radialGradient></defs>
<g clip-path="url(#wt-clip)"><rect width="900" height="76" fill="#0C0C16"/><ellipse cx="0" cy="0" rx="540" ry="68" fill="url(#wt-spot)"/>
<text x="28" y="31" class="mono" font-size="11" letter-spacing="2.2" fill="#8B5CF6">04<tspan fill="#6C6C88"> / </tspan>SELECTED WORK</text>
<text x="28" y="57" class="sans" font-size="20" font-weight="700" fill="#EEEEF8">Things I have designed, built &amp; shipped.</text>
<text x="872" y="47" text-anchor="end" class="mono" font-size="11" letter-spacing="2" fill="#C4B5FD">BROWSE ALL REPOSITORIES ↗</text>
</g><rect x=".5" y=".5" width="899" height="75" rx="17.5" fill="none" stroke="url(#wt-edge)"/>
</svg>
