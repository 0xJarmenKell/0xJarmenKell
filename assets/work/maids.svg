  <stop offset=".45" stop-color="#1F1F35" stop-opacity=".9"/>
  <stop offset="1" stop-color="#22D3EE" stop-opacity=".55"/>
</linearGradient>
<radialGradient id="p-spot" cx="0" cy="0" r="1">
  <stop offset="0" stop-color="#fff" stop-opacity=".06"/>
  <stop offset="1" stop-color="#fff" stop-opacity="0"/>
</radialGradient>
<radialGradient id="glow" cx="1" cy="0" r="1"><stop offset="0" stop-color="#FBBF24" stop-opacity=".22"/>
  <stop offset="1" stop-color="#FBBF24" stop-opacity="0"/></radialGradient>
<linearGradient id="top" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FBBF24" stop-opacity="0"/>
  <stop offset=".5" stop-color="#FBBF24"/><stop offset="1" stop-color="#FBBF24" stop-opacity="0"/></linearGradient></defs>
<g clip-path="url(#p-clip)"><rect width="440" height="200" fill="#0C0C16"/><ellipse cx="0" cy="0" rx="264" ry="180" fill="url(#p-spot)"/>
<rect width="440" height="200" fill="url(#glow)"/>
<rect class="sheen" x="0" y="0" width="160" height="1.5" fill="url(#top)" style="animation-delay:2.1s"/>
