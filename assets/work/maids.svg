<svg xmlns="http://www.w3.org/2000/svg" width="440" height="200" viewBox="0 0 440 200" fill="none" role="img" aria-label="Maids.cc Admin Dashboard — Angular admin dashboard with user management, dynamic data rendering and instant filtering — built clean, typed and component-first.">
<title>Maids.cc Admin Dashboard — Angular admin dashboard with user management, dynamic data rendering and instant filtering — built clean, typed and component-first.</title>
<style>
.sans{font-family:'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,Inter,'Helvetica Neue',Ubuntu,Arial,sans-serif}
.mono{font-family:'JetBrains Mono','Cascadia Code','SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.in{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
.blink{animation:blink 1.05s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.sheen{animation:sheen 6s ease-in-out infinite}
@keyframes sheen{0%{transform:translateX(-160px)}60%,100%{transform:translateX(480px)}}</style>
<defs>
<clipPath id="p-clip"><rect width="440" height="200" rx="16"/></clipPath>
<linearGradient id="p-edge" x1="0" y1="0" x2="1" y2="1">
